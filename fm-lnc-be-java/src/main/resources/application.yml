server:
  port: ${PORT:3001}
  address: ${HOST:0.0.0.0}
  tomcat:
    max-swallow-size: 50MB

spring:
  application:
    name: fm-lnc-be-java
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:fm_lnc_db}?reWriteBatchedInserts=true
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api/docs

app:
  lnc-dir: ${LNC_FILES_DIR:./data}
