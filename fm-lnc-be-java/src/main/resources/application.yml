server:
  port: ${PORT:3001}
  address: ${HOST:0.0.0.0}
  tomcat:
    max-swallow-size: 50MB

spring:
  application:
    name: fm-lnc-be-java
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:fm_lnc_db}?sslmode=${DB_SSL_MODE:disable}&reWriteBatchedInserts=true}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:2}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 300000
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api/docs

app:
  lnc-dir: ${LNC_FILES_DIR:./data}
